<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow">
<title>Heynen Entwürfe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{--bg:#141517;--panel:#1e2023;--panel2:#292c30;--ink:#f1f2f3;--mut:#a9adb1;--rule:#383b3f;--red:#d42f22;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{overflow:hidden}
#fr{position:fixed;inset:0;width:100%;height:100%;border:0;background:var(--bg);opacity:1;transition:opacity .25s}
#fr.ld{opacity:0}
#tab{position:fixed;right:0;top:50%;translate:0 -50%;z-index:20;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px 14px 9px;border:1px solid var(--rule);border-right:0;border-radius:10px 0 0 10px;background:var(--panel);color:var(--ink);font:700 .86rem/1 inherit;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.45);padding-right:max(8px,env(safe-area-inset-right,0px))}
#tab span{writing-mode:vertical-rl;letter-spacing:.06em}
#tab svg{width:18px;height:18px;stroke:var(--red);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#tab:hover,#tab:focus-visible{background:var(--panel2);outline:2px solid var(--red);outline-offset:-2px}
#hint{position:fixed;right:52px;top:50%;translate:0 -50%;z-index:19;max-width:210px;padding:10px 12px;border-radius:8px;background:var(--red);color:#fff;font-weight:600;font-size:.84rem;box-shadow:0 6px 24px rgba(0,0,0,.4);animation:hn .5s .8s both}
#hint::after{content:"";position:absolute;right:-6px;top:50%;translate:0 -50%;border:7px solid transparent;border-left-color:var(--red);border-right:0}
@keyframes hn{from{opacity:0;translate:10px -50%}to{opacity:1;translate:0 -50%}}
#sh{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .25s}
#sh.on{opacity:1;pointer-events:auto}
#dr{position:fixed;top:0;right:0;bottom:0;z-index:31;width:min(420px,92vw);display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--rule);translate:100% 0;transition:translate .3s cubic-bezier(.2,.7,.2,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
#dr.on{translate:0 0}
.dh{display:flex;align-items:center;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--rule)}
.dh h2{margin:0;font-size:1.1rem;letter-spacing:-.01em;flex:1}
.dh button,.nv button{width:38px;height:38px;border:1px solid var(--rule);border-radius:8px;background:var(--panel2);color:var(--ink);font:inherit;font-size:1.05rem;cursor:pointer}
.dh button:hover,.nv button:hover{border-color:var(--red)}
.nt{margin:0;padding:10px 16px;color:var(--mut);font-size:.84rem;border-bottom:1px solid var(--rule)}
.nv{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--rule)}
.nv b{flex:1;font-size:.95rem}.nv small{color:var(--mut);font-weight:400}
#ls{flex:1;overflow:auto;padding:12px 16px 20px;display:grid;gap:12px;align-content:start}
.sk{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center;padding:8px;border:1px solid var(--rule);border-radius:10px;background:var(--bg);color:inherit;text-align:left;font:inherit;cursor:pointer}
.sk img{width:120px;height:75px;object-fit:cover;border-radius:6px;display:block;background:var(--panel2)}
.sk b{display:block;font-size:.98rem}.sk span{display:block;color:var(--mut);font-size:.82rem}
.sk:hover{border-color:var(--mut)}.sk[aria-current="true"]{border-color:var(--red);background:var(--panel2)}
.sk:focus-visible{outline:2px solid var(--red)}
@media(max-width:420px){.sk{grid-template-columns:96px minmax(0,1fr)}.sk img{width:96px;height:60px}}
@media(prefers-reduced-motion:reduce){#fr,#dr,#sh{transition:none}#hint{animation:none}}
</style>
<iframe id="fr" title="Entwurf der Website"></iframe>
<button id="tab" type="button" aria-label="Skins öffnen: Entwurf wechseln"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="8" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/><rect x="13" y="13" width="8" height="8" rx="1.5"/></svg><span>Skins</span></button>
<div id="hint">10 Entwürfe zum Ausprobieren: hier wechseln</div>
<div id="sh"></div>
<aside id="dr" role="dialog" aria-label="Skins" aria-hidden="true">
<div class="dh"><h2>Skins</h2><button id="cl" type="button" aria-label="Schließen">✕</button></div>
<p class="nt">Jeder Skin ist eine vollständige Version der Seite. Zum Vergleichen einfach durchklicken. Diese Auswahl dient nur der Ansicht und gehört nicht zur späteren Website.</p>
<div class="nv"><button id="pv" type="button" aria-label="Vorheriger Skin">‹</button><b id="cur"></b><button id="nx" type="button" aria-label="Nächster Skin">›</button></div>
<div id="ls"></div>
</aside>
<script>
(function(){
var S=[
['anthrazit','Anthrazit','Workwear-Look, kräftige Farbflächen'],
['schaltplan','Schaltplan','Technisches Zeichenblatt mit Stromkreis'],
['licht','Licht','Dunkel und ruhig, Lichtkegel folgt dem Zeiger'],
['kabel','Kabel','Eine Leitung führt durch die Seite'],
['index','Index','Große Leistungszeilen zum Aufklappen'],
['mosaik','Mosaik','Kacheln im Bento-Raster'],
['elemente','Elemente','Vollbild-Szenen für Strom, Kälte und Luft'],
['plakat','Plakat','Grafisch und kräftig, mit Laufband'],
['weiche','Weiche','Privat, Gewerbe oder Bauträger wählen'],
['konfigurator','Konfigurator','Anfrage in 4 Schritten gleich im Einstieg']];
var $=function(i){return document.getElementById(i)};
var fr=$('fr'),dr=$('dr'),sh=$('sh'),cur=$('cur'),ls=$('ls'),hint=$('hint'),k=0;
var V='20261117a';function file(n){return 's/'+n+'.html?v='+V}
function get(){try{return localStorage.getItem('skin')}catch(e){return null}}
function put(v){try{localStorage.setItem('skin',v)}catch(e){}}
S.forEach(function(s,i){var b=document.createElement('button');b.type='button';b.className='sk';b.dataset.i=i;b.innerHTML='<img src="t/'+s[0]+'.jpg" alt="" loading="lazy"><div><b>'+(i+1)+'. '+s[1]+'</b><span>'+s[2]+'</span></div>';b.onclick=function(){go(i,true)};ls.appendChild(b)});
function go(i,close,init){
 k=(i+S.length)%S.length;var s=S[k];
 fr.classList.add('ld');
 setTimeout(function(){fr.src=file(s[0])},120);
 fr.onload=function(){fr.classList.remove('ld')};
 cur.innerHTML=(k+1)+'/10 · '+s[1];
 [].forEach.call(ls.children,function(c,j){c.setAttribute('aria-current',j===k?'true':'false')});
 put(s[0]);try{history.replaceState(null,'','#'+s[0])}catch(e){}
 if(close)open(false);
 if(!init)hide();
}
function open(on){dr.classList.toggle('on',on);sh.classList.toggle('on',on);dr.setAttribute('aria-hidden',on?'false':'true');if(on){hide();$('cl').focus()}else{$('tab').focus()}}
function hide(){if(hint){hint.remove();hint=null}}
$('tab').onclick=function(){open(true)};$('cl').onclick=function(){open(false)};sh.onclick=function(){open(false)};
$('pv').onclick=function(){go(k-1)};$('nx').onclick=function(){go(k+1)};
addEventListener('keydown',function(e){if(e.key==='Escape')open(false)});
setTimeout(hide,9000);
function idx(n){for(var i=0;i<S.length;i++)if(S[i][0]===n)return i;return -1}
var h=(location.hash||'').slice(1),st=idx(h);if(st<0)st=idx(get());if(st<0)st=0;
addEventListener('hashchange',function(){var j=idx((location.hash||'').slice(1));if(j>=0&&j!==k)go(j)});
go(st,false,true);
})();
</script>

</body></html>
